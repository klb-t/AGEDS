services:
  api:
    build: ./server
    # Loopback only; expose through an authenticating proxy, never directly.
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./server/data:/app/data
  worker:
    build: ./server
    command: python -m app.worker
    volumes:
      - ./server/data:/app/data
