name: Manual verification

on:
  workflow_dispatch:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r server/requirements-test.txt
      - run: python -m pytest server/tests -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - run: ./gradlew :androidApp:assembleDebug :androidApp:testDebugUnitTest :core:desktopTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ageds-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
