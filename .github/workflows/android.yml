name: Manual verification

on:
  workflow_dispatch:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r server/requirements-test.txt
      - run: python -m pytest server/tests -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Hosted runners ship an SDK at $ANDROID_HOME; compileSdk 37 may need installing and
      # may carry the SDK preview licence, so accept licences explicitly first.
      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for channel in 0 1 3; do
            echo "== channel $channel"
            "$SDKMANAGER" --list --channel=$channel 2>/dev/null | grep -E '^ *(platforms;|build-tools;)' | sort -u | tail -40 || true
            package=$("$SDKMANAGER" --list --channel=$channel 2>/dev/null | grep -oE 'platforms;android-37[^ |]*' | sort -u | head -1 || true)
            if [ -n "$package" ]; then
              echo "installing $package from channel $channel"
              yes | "$SDKMANAGER" --channel=$channel --install "$package" "platform-tools"
              break
            fi
          done
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms" | grep -q -- '-37' || { echo "no API 37 platform available on this runner"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      # The pinned wrapper (gradle-wrapper.properties) is the build's Gradle version.
      - run: ./gradlew :androidApp:assembleDebug :androidApp:testDebugUnitTest :core:desktopTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ageds-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ageds-android-test-reports
          path: |
            androidApp/build/reports/tests/
            androidApp/build/test-results/
            core/build/reports/tests/
            core/build/test-results/
          if-no-files-found: ignore

  android-emulator:
    # Instrumented advocate screen against a synthetic backend in the same job (no real data, no network model).
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r server/requirements-test.txt
      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for channel in 0 1 3; do
            echo "== channel $channel"
            "$SDKMANAGER" --list --channel=$channel 2>/dev/null | grep -E '^ *(platforms;|build-tools;)' | sort -u | tail -40 || true
            package=$("$SDKMANAGER" --list --channel=$channel 2>/dev/null | grep -oE 'platforms;android-37[^ |]*' | sort -u | head -1 || true)
            if [ -n "$package" ]; then
              echo "installing $package from channel $channel"
              yes | "$SDKMANAGER" --channel=$channel --install "$package" "platform-tools"
              break
            fi
          done
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms" | grep -q -- '-37' || { echo "no API 37 platform available on this runner"; exit 1; }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Start synthetic advocate backend
        run: |
          # The emulator reaches the host as 10.0.2.2; the Host allow-list must name it.
          EW_ALLOWED_HOSTS=10.0.2.2 AGEDS_BROWSER_PORT=8090 nohup python -m server.tests.browser_advocate_fixture > fixture.out 2> fixture.err &
          for i in $(seq 1 90); do [ -s fixture.out ] && break; sleep 1; done
          token=$(head -1 fixture.out | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          hidden=$(head -1 fixture.out | python -c 'import json,sys; print(json.load(sys.stdin)["hidden"])')
          echo "::add-mask::$token"
          echo "AGEDS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "AGEDS_HIDDEN=$hidden" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8090/advocate > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8090/advocate > /dev/null
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :androidApp:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.klbt.ageds.AdvocateScreenTest -Pandroid.testInstrumentationRunnerArguments.agedsServer=http://10.0.2.2:8090 -Pandroid.testInstrumentationRunnerArguments.agedsToken=$AGEDS_TOKEN -Pandroid.testInstrumentationRunnerArguments.agedsHidden=$AGEDS_HIDDEN -Pandroid.testInstrumentationRunnerArguments.agedsTimeoutMs=90000 --stacktrace || { adb logcat -d > logcat.txt; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ageds-android-emulator-reports
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
            fixture.err
            logcat.txt
          if-no-files-found: ignore
