<nav class="ageds-nav" aria-label="{{ t('nav.aria') }}">{% for path, label in ageds_nav %}<a href="{{path}}">{{ t_nav(path, label) }}</a>{% endfor %}<span class="ageds-tools" data-wb-tools><form method="get" data-wb-lang-form><label><span class="wb-sr">{{ t('shell.language') }}</span><select name="lang" data-wb-lang>{% for code in ui_languages %}<option value="{{code}}"{% if code == ui_lang() %} selected{% endif %}>{{ t('lang.' ~ code) }}</option>{% endfor %}</select></label><noscript><button>{{ t('shell.apply') }}</button></noscript></form><button type="button" data-wb-theme-toggle title="{{ t('shell.theme.title') }}">{{ t('shell.theme.button') }}</button><button type="button" data-wb-help aria-keyshortcuts="?" title="{{ t('shell.help.title') }}">?</button><button type="button" data-wb-palette aria-keyshortcuts="Control+K" title="{{ t('shell.palette.title') }}">{{ t('shell.palette.button') }}</button></span></nav>
