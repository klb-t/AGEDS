name: Manual verification

on:
  workflow_dispatch:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r server/requirements-test.txt
      - run: python -m pytest server/tests -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Hosted runners ship an SDK at $ANDROID_HOME; compileSdk 37 may need installing and
      # may carry the SDK preview licence, so accept licences explicitly first.
      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for channel in 0 1 3; do
            echo "== channel $channel"
            "$SDKMANAGER" --list --channel=$channel 2>/dev/null | grep -E '^ *(platforms;|build-tools;)' | sort -u | tail -40 || true
            package=$("$SDKMANAGER" --list --channel=$channel 2>/dev/null | grep -oE 'platforms;android-37[^ |]*' | sort -u | head -1 || true)
            if [ -n "$package" ]; then
              echo "installing $package from channel $channel"
              yes | "$SDKMANAGER" --channel=$channel --install "$package" "platform-tools"
              break
            fi
          done
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms" | grep -q -- '-37' || { echo "no API 37 platform available on this runner"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      # The pinned wrapper (gradle-wrapper.properties) is the build's Gradle version.
      - run: ./gradlew :androidApp:assembleDebug :androidApp:testDebugUnitTest :core:desktopTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ageds-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ageds-android-test-reports
          path: |
            androidApp/build/reports/tests/
            androidApp/build/test-results/
            core/build/reports/tests/
            core/build/test-results/
          if-no-files-found: ignore
